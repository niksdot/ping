<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ping</title>
</head>
<body>
    <p id="ping"></p>

    <script>
        const p = document.getElementById('ping');
        const url = 'https://www.gstatic.com/generate_204?t=' + performance.now();
        const start = performance.now();
        const img = new Image();

        img.onload = img.onerror = () => {
            p.textContent = `Ping: ${Math.round(performance.now() - start)} ms`;
        };

        img.src = url;
    </script>
</body>
</html>
