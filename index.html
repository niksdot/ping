<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ping</title>
</head>
<body>
    <p id="ping">Doing...</p>

    <script>
        const p = document.getElementById('ping');
        const REQUESTS = 5;

        function measurePing() {
            return new Promise(resolve => {
                const start = performance.now();
                const img = new Image();

                img.onload = img.onerror = () => {
                    resolve(performance.now() - start);
                };

                img.src = `https://www.gstatic.com/generate_204?t=${performance.now()}&r=${Math.random()}`;
            });
        }

        (async () => {
            const times = await Promise.all(
                Array.from({ length: REQUESTS }, () => measurePing())
            );

            const average = times.reduce((sum, time) => sum + time, 0) / REQUESTS;

            p.textContent = `Ping: ${Math.round(average)} ms`;
            console.log(
                `Pings: ${times.map(t => Math.round(t)).join(', ')} ms`
            );
        })();
    </script>
</body>
</html>
