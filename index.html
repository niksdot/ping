<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ping</title>
</head>
<body>
    <p id="ping">Ping: </p>

    <script>
        const p = document.getElementById('ping');
        const url = 'https://www.gstatic.com/generate_204?t=' + Date.now();

        const start = performance.now();

        fetch(url, { method: 'HEAD', cache: 'no-store' })
            .then(() => {
                p.textContent = `Ping: ${Math.round(performance.now() - start)} ms`;
            })
            .catch(() => {
                p.textContent = 'Ping: ошибка';
            });
    </script>
</body>
</html>
