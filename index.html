<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ping</title>
</head>
<body>
    <p id="ping">Ping: —</p>

    <script>
        const start = performance.now();
        fetch('https://www.gstatic.com/generate_204', { mode: 'no-cors' })
            .catch(() => {})
            .finally(() => {
                document.getElementById('ping').textContent = Ping: ${Math.round(performance.now() - start)} ms;
            });
    </script>
</body>
</html>
